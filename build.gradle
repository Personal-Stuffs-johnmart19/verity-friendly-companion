plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Git/Windows checkout line endings must not change distributed resource bytes.
tasks.named('processResources') {
    inputs.property('textLineEndings', 'LF-v1')
    filteringCharset = 'UTF-8'
    filesMatching(['**/*.json', '**/*.js', '**/*.toml']) {
        filter(org.apache.tools.ant.filters.FixCrLfFilter,
            eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'),
            fixlast: false)
    }
}

def metadata = file('src/main/resources/META-INF/neoforge.mods.toml').getText('UTF-8')
def match = metadata =~ /(?m)^version="([0-9A-Za-z.-]+)"/
if (!match.find()) throw new GradleException('Missing addon version')
version = match.group(1)
group = 'dev.johnmart19.veritycompanion'
base { archivesName = 'verity-friendly-companion' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
neoForge {
    version = '21.1.250'
    mods {
        verity_companion { sourceSet sourceSets.main }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('jar', Jar) {
    inputs.property('licenseLineEndings', 'LF-v1')
    destinationDirectory = layout.projectDirectory.dir('dist')
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE.txt' }
        filteringCharset = 'UTF-8'
        filter(org.apache.tools.ant.filters.FixCrLfFilter,
            eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'),
            fixlast: false)
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
